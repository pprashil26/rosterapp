<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>Roster</title>

<style>
:root{
  --bg:#efefec;
  --paper:#fff;
  --ink:#20211f;
  --muted:#777a74;
  --line:#dedfd9;
  --work:#3d6fa8;
  --off:#90958f;
  --leave:#4f8a67;
  --family:#cb7d34;
  --school:#7b63a5;
  --public:#b94d4d;
  --shadow:0 10px 30px rgba(0,0,0,.09)
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,
input,
textarea,
select{
  font:inherit;
  color:inherit
}

.app{
  min-height:100vh
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(247,247,245,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)
}

.top-inner{
  max-width:1180px;
  margin:auto;
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:10px
}

.brand{
  font-size:20px;
  font-weight:850;
  letter-spacing:.08em
}

.spacer{
  flex:1
}

.icon-btn,
.text-btn{
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:10px;
  min-height:38px;
  padding:0 12px;
  font-weight:700;
  cursor:pointer
}

.icon-btn{
  width:40px;
  padding:0;
  font-size:20px
}

.main{
  max-width:1180px;
  margin:auto;
  display:grid;
  grid-template-columns:minmax(0,1fr) 310px;
  gap:16px;
  padding:16px
}

.content,
.side{
  min-width:0
}

.today{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:14px
}

.eyebrow{
  font-size:11px;
  font-weight:850;
  letter-spacing:.14em;
  color:var(--muted)
}

.today-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
  margin-top:5px
}

.today-date{
  font-size:22px;
  font-weight:850
}

.availability{
  padding:7px 10px;
  border-radius:999px;
  background:#eef1ed;
  font-size:11px;
  font-weight:900;
  letter-spacing:.06em
}

.people-now{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px
}

.person-card{
  border:1px solid var(--line);
  border-radius:12px;
  padding:9px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.person-name{
  font-weight:800
}

.status-chip{
  font-size:11px;
  font-weight:900;
  padding:4px 7px;
  border-radius:7px;
  color:#fff
}

.month{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  margin-bottom:14px;
  scroll-margin-top:72px
}

.month-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding:2px 3px 10px
}

.month-title{
  font-size:18px;
  font-weight:850
}

.month-year{
  color:var(--muted);
  font-weight:700
}

.weekdays,
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr)
}

.weekdays div{
  text-align:center;
  padding:4px 0 7px;
  color:var(--muted);
  font-size:10px;
  font-weight:850
}

.day{
  position:relative;
  min-height:74px;
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
  padding:5px;
  background:#fff;
  cursor:pointer;
  overflow:hidden
}

.day:nth-child(7n+1){
  border-left:0
}

.day.other{
  background:#fafaf8;
  color:#b3b5af
}

.day.today-cell{
  box-shadow:inset 0 0 0 2px var(--ink)
}

.day-number{
  font-size:11px;
  font-weight:850
}

.marks{
  display:grid;
  gap:3px;
  margin-top:5px
}

.person-mark{
  height:15px;
  border-radius:4px;
  padding:1px 4px;
  color:#fff;
  font-size:9px;
  font-weight:900;
  display:flex;
  align-items:center;
  gap:3px;
  white-space:nowrap
}

.person-mark b{
  font-size:8px;
  opacity:.85
}

.icons{
  position:absolute;
  right:4px;
  bottom:3px;
  display:flex;
  gap:2px;
  font-size:10px
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  display:inline-block
}

.side{
  position:sticky;
  top:77px;
  align-self:start
}

.panel{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px;
  margin-bottom:12px
}

.panel h2{
  font-size:13px;
  margin:0 0 10px;
  letter-spacing:.06em
}

.upcoming{
  display:grid;
  gap:8px
}

.up-row{
  display:grid;
  grid-template-columns:45px 1fr;
  gap:8px;
  align-items:start
}

.up-date{
  font-size:11px;
  font-weight:900;
  color:var(--muted)
}

.up-text{
  font-size:12px;
  font-weight:700
}

.empty{
  color:var(--muted);
  font-size:12px
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.legend span{
  font-size:10px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:4px
}

.bottom-nav{
  display:none
}

.modal-wrap{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(16,17,15,.45);
  display:none;
  align-items:flex-end;
  justify-content:center
}

.modal-wrap.open{
  display:flex
}

.sheet{
  width:min(560px,100%);
  max-height:92vh;
  overflow:auto;
  background:var(--paper);
  border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow)
}

.sheet-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:14px
}

.sheet-title{
  font-size:19px;
  font-weight:900
}

.close{
  margin-left:auto
}

.field{
  margin:12px 0
}

.field label{
  display:block;
  font-size:11px;
  font-weight:900;
  letter-spacing:.05em;
  margin-bottom:6px
}

.seg{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px
}

.seg button{
  border:1px solid var(--line);
  background:#fafaf8;
  border-radius:8px;
  padding:9px 3px;
  font-size:11px;
  font-weight:850;
  cursor:pointer
}

.seg button.active{
  background:var(--ink);
  border-color:var(--ink);
  color:#fff
}

input[type=text],
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fcfcfa;
  padding:10px
}

textarea{
  min-height:70px;
  resize:vertical
}

.checks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

.check{
  display:flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px
}

.primary{
  flex:1;
  background:var(--ink);
  color:#fff;
  border:0;
  border-radius:11px;
  padding:12px;
  font-weight:900
}

.danger{
  border:1px solid #e3c6c6;
  background:#fff6f6;
  color:#9f3434;
  border-radius:11px;
  padding:12px;
  font-weight:800
}

.settings{
  position:fixed;
  inset:0;
  z-index:110;
  background:rgba(16,17,15,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px
}

.settings.open{
  display:flex
}

.dialog{
  width:min(450px,100%);
  background:#fff;
  border-radius:18px;
  padding:16px;
  box-shadow:var(--shadow)
}

.dialog h2{
  margin:0
}

.settings-grid{
  display:grid;
  gap:10px;
  margin:14px 0
}

.file-input{
  display:none
}

.note{
  font-size:11px;
  color:var(--muted)
}

@media(max-width:800px){
  body{
    background:#f7f7f5
  }

  .main{
    display:block;
    padding:10px 8px 74px
  }

  .side{
    display:none
  }

  .top-inner{
    padding:9px 10px
  }

  .brand{
    font-size:18px
  }

  .text-btn span{
    display:none
  }

  .today{
    border-radius:14px;
    padding:12px
  }

  .today-date{
    font-size:19px
  }

  .month{
    border-radius:14px;
    padding:8px;
    margin-bottom:10px
  }

  .month-title{
    font-size:16px
  }

  .day{
    min-height:61px;
    padding:4px 3px
  }

  .person-mark{
    height:13px;
    font-size:8px;
    padding:1px 3px
  }

  .person-mark b{
    display:none
  }

  .icons{
    font-size:8px;
    bottom:2px;
    right:2px
  }

  .bottom-nav{
    position:fixed;
    z-index:30;
    bottom:0;
    left:0;
    right:0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    background:rgba(255,255,255,.96);
    border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom))
  }

  .bottom-nav button{
    border:0;
    background:transparent;
    font-size:10px;
    font-weight:850;
    padding:7px
  }

  .bottom-nav b{
    display:block;
    font-size:18px
  }

  .seg{
    grid-template-columns:repeat(4,1fr)
  }

  .checks{
    grid-template-columns:1fr
  }

  .modal-wrap{
    align-items:flex-end
  }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">
  <div class="top-inner">
    <div class="brand">ROSTER</div>
    <div class="spacer"></div>
    <button class="text-btn" id="todayBtn">Today</button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⋯</button>
  </div>
</header>

<main class="main">

  <section class="content">
    <div id="todayCard" class="today"></div>
    <div id="months"></div>
  </section>

  <aside class="side">

    <div class="panel">
      <h2>UPCOMING BOTH OFF</h2>
      <div class="upcoming" id="bothOff"></div>
    </div>

    <div class="panel">
      <h2>UPCOMING FAMILY</h2>
      <div class="upcoming" id="familyUpcoming"></div>
    </div>

    <div class="panel">
      <h2>LEGEND</h2>

      <div class="legend">
        <span>
          <i class="dot" style="background:var(--work)"></i>
          Work
        </span>

        <span>
          <i class="dot" style="background:var(--off)"></i>
          Off
        </span>

        <span>
          <i class="dot" style="background:var(--leave)"></i>
          Leave
        </span>

        <span>
          <i class="dot" style="background:var(--school)"></i>
          School
        </span>

        <span>
          <i class="dot" style="background:var(--public)"></i>
          Public
        </span>
      </div>
    </div>

  </aside>

</main>

<nav class="bottom-nav">
  <button id="navToday">
    <b>●</b>
    Today
  </button>

  <button id="navAdd">
    <b>＋</b>
    Add
  </button>

  <button id="navSettings">
    <b>⋯</b>
    More
  </button>
</nav>

</div>

<div class="modal-wrap" id="editor">

  <div class="sheet">

    <div class="sheet-head">
      <div>
        <div class="eyebrow">EDIT DAY</div>
        <div class="sheet-title" id="editorDate"></div>
      </div>

      <button class="icon-btn close" id="closeEditor">×</button>
    </div>

    <div class="field">
      <label id="meLabel">PRASHIL</label>
      <div class="seg" id="meSeg"></div>
    </div>

    <div class="field">
      <label id="wifeLabel">WIFE</label>
      <div class="seg" id="wifeSeg"></div>
    </div>

    <div class="field">
      <label>DAY FLAGS</label>

      <div class="checks">
        <label class="check">
          <input type="checkbox" id="schoolHoliday">
          School holiday
        </label>

        <label class="check">
          <input type="checkbox" id="publicHoliday">
          Public holiday
        </label>
      </div>
    </div>

    <div class="field">
      <label>FAMILY EVENT / HOLIDAY</label>
      <input type="text" id="family" placeholder="e.g. Family trip">
    </div>

    <div class="field">
      <label>NOTES</label>
      <textarea id="notes" placeholder="Optional note"></textarea>
    </div>

    <div class="actions">
      <button class="danger" id="clearDay">Clear</button>
      <button class="primary" id="saveDay">Save Day</button>
    </div>

  </div>

</div>

<div class="settings" id="settings">

  <div class="dialog">

    <div class="sheet-head">
      <div>
        <div class="eyebrow">ROSTER</div>
        <h2>Settings &amp; Backup</h2>
      </div>

      <button class="icon-btn close" id="closeSettings">×</button>
    </div>

    <div class="settings-grid">

      <div class="field">
        <label>YOUR NAME</label>
        <input id="meName" type="text">
      </div>

      <div class="field">
        <label>PARTNER NAME</label>
        <input id="wifeName" type="text">
      </div>

      <button class="text-btn" id="exportBtn">
        Export JSON Backup
      </button>

      <button class="text-btn" id="importBtn">
        Import JSON Backup
      </button>

      <input
        class="file-input"
        id="importFile"
        type="file"
        accept="application/json"
      >

      <button class="danger" id="resetBtn">
        Reset All Data
      </button>

    </div>

    <div class="note">
      Data stays in this browser. Export a backup periodically and before
      clearing browser storage.
    </div>

  </div>

</div>

<script>
(() => {
  'use strict';

  const KEY = 'roster.mvp.v1';

  const STATUS = [
    'NONE',
    'WORK',
    'OFF',
    'LEAVE'
  ];

  const COLORS = {
    WORK: 'var(--work)',
    OFF: 'var(--off)',
    LEAVE: 'var(--leave)',
    NONE: '#c8cbc5'
  };

  const defaultState = () => ({
    version: 1,
    settings: {
      meName: 'Prashil',
      wifeName: 'Wife'
    },
    days: {}
  });

  let state = load();
  let editingKey = '';

  const $ = selector => document.querySelector(selector);

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));

      return saved && saved.version === 1
        ? {
            ...defaultState(),
            ...saved,
            settings: {
              ...defaultState().settings,
              ...saved.settings
            },
            days: saved.days || {}
          }
        : defaultState();
    } catch {
      return defaultState();
    }
  }

  function persist() {
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function key(date) {
    return [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, '0'),
      String(date.getDate()).padStart(2, '0')
    ].join('-');
  }

  function fromKey(dateKey) {
    const [year, month, day] = dateKey.split('-').map(Number);
    return new Date(year, month - 1, day);
  }

  function fmt(date, options) {
    return new Intl.DateTimeFormat('en-AU', options).format(date);
  }

  function record(dateKey) {
    return state.days[dateKey] || {
      me: 'NONE',
      wife: 'NONE',
      family: '',
      notes: '',
      schoolHoliday: false,
      publicHoliday: false
    };
  }

  function availability(dayRecord) {
    const meAvailable =
      dayRecord.me !== 'WORK' &&
      dayRecord.me !== 'NONE';

    const wifeAvailable =
      dayRecord.wife !== 'WORK' &&
      dayRecord.wife !== 'NONE';

    if (
      dayRecord.me === 'WORK' &&
      dayRecord.wife === 'WORK'
    ) {
      return 'BOTH WORKING';
    }

    if (meAvailable && wifeAvailable) {
      return 'BOTH OFF';
    }

    if (
      (meAvailable && dayRecord.wife === 'WORK') ||
      (wifeAvailable && dayRecord.me === 'WORK')
    ) {
      return 'ONE AVAILABLE';
    }

    return 'ROSTER NOT SET';
  }

  function statusText(status) {
    return status === 'NONE'
      ? 'Not set'
      : status[0] + status.slice(1).toLowerCase();
  }

  function renderToday() {
    const today = new Date();
    const dayRecord = record(key(today));

    $('#todayCard').innerHTML = `
      <div class="eyebrow">TODAY</div>

      <div class="today-row">
        <div class="today-date">
          ${fmt(today, {
            weekday: 'long',
            day: 'numeric',
            month: 'long'
          })}
        </div>

        <div class="availability">
          ${availability(dayRecord)}
        </div>
      </div>

      <div class="people-now">

        <div class="person-card">
          <span class="person-name">
            ${esc(state.settings.meName)}
          </span>

          <span
            class="status-chip"
            style="background:${COLORS[dayRecord.me]}"
          >
            ${statusText(dayRecord.me)}
          </span>
        </div>

        <div class="person-card">
          <span class="person-name">
            ${esc(state.settings.wifeName)}
          </span>

          <span
            class="status-chip"
            style="background:${COLORS[dayRecord.wife]}"
          >
            ${statusText(dayRecord.wife)}
          </span>
        </div>

      </div>
    `;
  }

  function renderMonths() {
    const host = $('#months');
    host.innerHTML = '';

    const now = new Date();

    for (let offset = -1; offset < 13; offset++) {
      const base = new Date(
        now.getFullYear(),
        now.getMonth() + offset,
        1
      );

      host.appendChild(monthElement(base));
    }
  }

  function monthElement(base) {
    const section = document.createElement('section');

    section.className = 'month';
    section.id = 'month-' + key(base).slice(0, 7);

    section.innerHTML = `
      <div class="month-head">
        <div class="month-title">
          ${fmt(base, { month: 'long' })}
        </div>

        <div class="month-year">
          ${base.getFullYear()}
        </div>
      </div>

      <div class="weekdays">
        ${['M', 'T', 'W', 'T', 'F', 'S', 'S']
          .map(day => `<div>${day}</div>`)
          .join('')}
      </div>

      <div class="grid"></div>
    `;

    const grid = section.querySelector('.grid');

    const start = (base.getDay() + 6) % 7;

    const first = new Date(base);
    first.setDate(1 - start);

    for (let index = 0; index < 42; index++) {
      const date = new Date(first);
      date.setDate(first.getDate() + index);

      grid.appendChild(
        dayElement(date, base.getMonth())
      );
    }

    return section;
  }

  function dayElement(date, month) {
    const dateKey = key(date);
    const dayRecord = record(dateKey);

    const element = document.createElement('div');

    element.className =
      'day' +
      (date.getMonth() !== month ? ' other' : '') +
      (dateKey === key(new Date()) ? ' today-cell' : '');

    let marks = '';

    if (dayRecord.me !== 'NONE') {
      marks += `
        <div
          class="person-mark"
          style="background:${COLORS[dayRecord.me]}"
        >
          <b>
            ${esc(
              state.settings.meName
                .slice(0, 1)
                .toUpperCase()
            )}
          </b>

          ${dayRecord.me[0]}
        </div>
      `;
    }

    if (dayRecord.wife !== 'NONE') {
      marks += `
        <div
          class="person-mark"
          style="background:${COLORS[dayRecord.wife]}"
        >
          <b>
            ${esc(
              state.settings.wifeName
                .slice(0, 1)
                .toUpperCase()
            )}
          </b>

          ${dayRecord.wife[0]}
        </div>
      `;
    }

    let icons = '';

    if (dayRecord.family) {
      icons += `
        <span title="Family event">●</span>
      `;
    }

    if (dayRecord.schoolHoliday) {
      icons += `
        <span
          style="color:var(--school)"
          title="School holiday"
        >
          ●
        </span>
      `;
    }

    if (dayRecord.publicHoliday) {
      icons += `
        <span
          style="color:var(--public)"
          title="Public holiday"
        >
          ●
        </span>
      `;
    }

    element.innerHTML = `
      <div class="day-number">
        ${date.getDate()}
      </div>

      <div class="marks">
        ${marks}
      </div>

      <div
        class="icons"
        style="color:var(--family)"
      >
        ${icons}
      </div>
    `;

    element.onclick = () => openEditor(dateKey);

    return element;
  }

  function renderSide() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const entries = Object.entries(state.days)
      .filter(([dateKey]) => fromKey(dateKey) >= today)
      .sort((first, second) =>
        first[0].localeCompare(second[0])
      );

    const bothOffEntries = entries
      .filter(([, dayRecord]) =>
        dayRecord.me !== 'WORK' &&
        dayRecord.me !== 'NONE' &&
        dayRecord.wife !== 'WORK' &&
        dayRecord.wife !== 'NONE'
      )
      .slice(0, 6);

    $('#bothOff').innerHTML = bothOffEntries.length
      ? bothOffEntries
          .map(([dateKey]) =>
            upcomingRow(dateKey, 'Both off')
          )
          .join('')
      : `
          <div class="empty">
            No shared days off entered.
          </div>
        `;

    const familyEntries = entries
      .filter(([, dayRecord]) => dayRecord.family)
      .slice(0, 6);

    $('#familyUpcoming').innerHTML = familyEntries.length
      ? familyEntries
          .map(([dateKey, dayRecord]) =>
            upcomingRow(
              dateKey,
              esc(dayRecord.family)
            )
          )
          .join('')
      : `
          <div class="empty">
            No family events entered.
          </div>
        `;
  }

  function upcomingRow(dateKey, text) {
    const date = fromKey(dateKey);

    return `
      <div class="up-row">

        <div class="up-date">
          ${fmt(date, {
            day: '2-digit',
            month: 'short'
          }).toUpperCase()}
        </div>

        <div class="up-text">
          ${text}
        </div>

      </div>
    `;
  }

  function makeSegment(selector, currentStatus) {
    const box = $(selector);

    box.innerHTML = STATUS
      .map(status => `
        <button
          data-status="${status}"
          class="${status === currentStatus ? 'active' : ''}"
        >
          ${statusText(status)}
        </button>
      `)
      .join('');

    box.onclick = event => {
      const button = event.target.closest('button');

      if (!button) {
        return;
      }

      box.querySelectorAll('button')
        .forEach(item =>
          item.classList.remove('active')
        );

      button.classList.add('active');
    };
  }

  function segmentValue(selector) {
    return $(selector)
      .querySelector('.active')
      .dataset.status;
  }

  function openEditor(dateKey) {
    editingKey = dateKey;

    const date = fromKey(dateKey);
    const dayRecord = record(dateKey);

    $('#editorDate').textContent = fmt(date, {
      weekday: 'short',
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    });

    $('#meLabel').textContent =
      state.settings.meName.toUpperCase();

    $('#wifeLabel').textContent =
      state.settings.wifeName.toUpperCase();

    makeSegment('#meSeg', dayRecord.me);
    makeSegment('#wifeSeg', dayRecord.wife);

    $('#family').value = dayRecord.family || '';
    $('#notes').value = dayRecord.notes || '';

    $('#schoolHoliday').checked =
      Boolean(dayRecord.schoolHoliday);

    $('#publicHoliday').checked =
      Boolean(dayRecord.publicHoliday);

    $('#editor').classList.add('open');
  }

  function closeEditor() {
    $('#editor').classList.remove('open');
  }

  function saveDay() {
    const dayRecord = {
      me: segmentValue('#meSeg'),
      wife: segmentValue('#wifeSeg'),
      family: $('#family').value.trim(),
      notes: $('#notes').value.trim(),
      schoolHoliday: $('#schoolHoliday').checked,
      publicHoliday: $('#publicHoliday').checked
    };

    const empty = Object.values(dayRecord)
      .every(value =>
        value === 'NONE' ||
        value === '' ||
        value === false
      );

    if (empty) {
      delete state.days[editingKey];
    } else {
      state.days[editingKey] = dayRecord;
    }

    persist();
    closeEditor();
    renderAll();
  }

  function renderAll() {
    renderToday();
    renderMonths();
    renderSide();
  }

  function scrollToday() {
    const currentMonth =
      document.getElementById(
        'month-' + key(new Date()).slice(0, 7)
      );

    if (currentMonth) {
      currentMonth.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });
    }
  }

  function openSettings() {
    $('#meName').value =
      state.settings.meName;

    $('#wifeName').value =
      state.settings.wifeName;

    $('#settings').classList.add('open');
  }

  function closeSettings() {
    state.settings.meName =
      $('#meName').value.trim() || 'Me';

    state.settings.wifeName =
      $('#wifeName').value.trim() || 'Partner';

    persist();

    $('#settings').classList.remove('open');

    renderAll();
  }

  function exportData() {
    const blob = new Blob(
      [JSON.stringify(state, null, 2)],
      { type: 'application/json' }
    );

    const link = document.createElement('a');

    link.href = URL.createObjectURL(blob);

    link.download =
      `roster-backup-${key(new Date())}.json`;

    link.click();

    setTimeout(() => {
      URL.revokeObjectURL(link.href);
    }, 1000);
  }

  function importData(file) {
    const reader = new FileReader();

    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);

        if (
          !imported ||
          imported.version !== 1 ||
          typeof imported.days !== 'object'
        ) {
          throw new Error('Invalid backup');
        }

        state = {
          ...defaultState(),
          ...imported,
          settings: {
            ...defaultState().settings,
            ...imported.settings
          },
          days: imported.days
        };

        persist();
        closeSettings();
        renderAll();

        alert('Backup imported successfully.');
      } catch {
        alert(
          'This is not a valid Roster v1 backup.'
        );
      }
    };

    reader.readAsText(file);
  }

  function esc(value) {
    return String(value).replace(
      /[&<>'"]/g,
      character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      })[character]
    );
  }

  $('#saveDay').onclick = saveDay;

  $('#clearDay').onclick = () => {
    if (
      confirm(
        'Clear all entries for this day?'
      )
    ) {
      delete state.days[editingKey];

      persist();
      closeEditor();
      renderAll();
    }
  };

  $('#closeEditor').onclick = closeEditor;

  $('#editor').onclick = event => {
    if (event.target === $('#editor')) {
      closeEditor();
    }
  };

  $('#settingsBtn').onclick = openSettings;
  $('#navSettings').onclick = openSettings;
  $('#closeSettings').onclick = closeSettings;

  $('#settings').onclick = event => {
    if (event.target === $('#settings')) {
      closeSettings();
    }
  };

  $('#todayBtn').onclick = scrollToday;
  $('#navToday').onclick = scrollToday;

  $('#navAdd').onclick = () =>
    openEditor(key(new Date()));

  $('#exportBtn').onclick = exportData;

  $('#importBtn').onclick = () =>
    $('#importFile').click();

  $('#importFile').onchange = event => {
    const file = event.target.files[0];

    if (file) {
      importData(file);
    }
  };

  $('#resetBtn').onclick = () => {
    if (
      confirm(
        'Permanently delete all roster data from this browser?'
      )
    ) {
      state = defaultState();

      persist();
      closeSettings();
      renderAll();
    }
  };

  renderAll();

  setTimeout(scrollToday, 50);
})();
</script>

</body>
</html>
