<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>Roster</title>
<style>
:root{--bg:#efefec;--paper:#fff;--ink:#20211f;--muted:#777a74;--line:#dedfd9;--work:#3d6fa8;--off:#90958f;--leave:#4f8a67;--family:#cb7d34;--school:#7b63a5;--public:#b94d4d;--me:#356fa8;--wife:#a75f87;--shadow:0 10px 30px rgba(0,0,0,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit;color:inherit}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:rgba(247,247,245,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.top-inner{max-width:1180px;margin:auto;padding:12px 14px;display:flex;align-items:center;gap:10px}.brand{font-size:20px;font-weight:850;letter-spacing:.08em}.spacer{flex:1}.icon-btn,.text-btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;min-height:38px;padding:0 12px;font-weight:700;cursor:pointer}.icon-btn{width:40px;padding:0;font-size:20px}.main{max-width:1180px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;padding:16px}.content,.side{min-width:0}.today{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.14em;color:var(--muted)}.today-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:5px}.today-date{font-size:22px;font-weight:850}.availability{padding:7px 10px;border-radius:999px;background:#eef1ed;font-size:11px;font-weight:900;letter-spacing:.06em}.people-now{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.person-card{border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:flex;align-items:center;justify-content:space-between}.person-name{font-weight:800}.status-chip{font-size:11px;font-weight:900;padding:4px 7px;border-radius:7px;color:#fff}.month{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px;scroll-margin-top:72px}.month-head{display:flex;justify-content:space-between;align-items:baseline;padding:2px 3px 10px}.month-title{font-size:18px;font-weight:850}.month-year{color:var(--muted);font-weight:700}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekdays div{text-align:center;padding:4px 0 7px;color:var(--muted);font-size:10px;font-weight:850}.day{position:relative;min-height:74px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:5px;background:#fff;cursor:pointer;overflow:hidden}.day:nth-child(7n+1){border-left:0}.day.other{background:#fafaf8;color:#b3b5af}.day.today-cell{box-shadow:inset 0 0 0 2px var(--ink)}.day-number{font-size:11px;font-weight:850}.marks{display:grid;gap:3px;margin-top:5px}.person-mark{height:15px;border-radius:4px;padding:1px 4px;color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;gap:3px;white-space:nowrap}.person-mark b{font-size:8px;opacity:.85}.icons{position:absolute;right:4px;bottom:3px;display:flex;gap:2px;font-size:10px}.dot{width:6px;height:6px;border-radius:50%;display:inline-block}.side{position:sticky;top:77px;align-self:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px}.panel h2{font-size:13px;margin:0 0 10px;letter-spacing:.06em}.upcoming{display:grid;gap:8px}.up-row{display:grid;grid-template-columns:45px 1fr;gap:8px;align-items:start}.up-date{font-size:11px;font-weight:900;color:var(--muted)}.up-text{font-size:12px;font-weight:700}.empty{color:var(--muted);font-size:12px}.legend{display:flex;flex-wrap:wrap;gap:8px}.legend span{font-size:10px;font-weight:800;display:flex;align-items:center;gap:4px}.bottom-nav{display:none}.modal-wrap{position:fixed;inset:0;z-index:100;background:rgba(16,17,15,.45);display:none;align-items:flex-end;justify-content:center}.modal-wrap.open{display:flex}.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}.sheet-title{font-size:19px;font-weight:900}.close{margin-left:auto}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:900;letter-spacing:.05em;margin-bottom:6px}.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.seg button{border:1px solid var(--line);background:#fafaf8;border-radius:8px;padding:9px 3px;font-size:11px;font-weight:850;cursor:pointer}.seg button.active{background:var(--ink);border-color:var(--ink);color:#fff}input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fcfcfa;padding:10px}textarea{min-height:70px;resize:vertical}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:9px}.actions{display:flex;gap:8px;margin-top:15px}.primary{flex:1;background:var(--ink);color:#fff;border:0;border-radius:11px;padding:12px;font-weight:900}.danger{border:1px solid #e3c6c6;background:#fff6f6;color:#9f3434;border-radius:11px;padding:12px;font-weight:800}.settings{position:fixed;inset:0;z-index:110;background:rgba(16,17,15,.45);display:none;align-items:center;justify-content:center;padding:16px}.settings.open{display:flex}.dialog{width:min(450px,100%);background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow)}.dialog h2{margin:0}.settings-grid{display:grid;gap:10px;margin:14px 0}.file-input{display:none}.note{font-size:11px;color:var(--muted)}
.continuous-calendar{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px;scroll-margin-top:104px;overflow:hidden}.continuous-head{display:flex;justify-content:space-between;align-items:baseline;padding:2px 3px 10px}.continuous-title{font-size:18px;font-weight:850}.continuous-range{color:var(--muted);font-size:11px;font-weight:700}.continuous-calendar .weekdays{position:sticky;top:59px;z-index:12;background:var(--paper);border-bottom:1px solid var(--line)}.day.weekend{background:#fafaf8}.day.month-start{background:#f4f4f0;box-shadow:inset 3px 0 0 #a8aaa4}.day.month-start.today-cell{box-shadow:inset 3px 0 0 #a8aaa4,inset 0 0 0 2px var(--ink)}.month-tag{font-size:8px;font-weight:900;letter-spacing:.08em;line-height:1;margin-bottom:2px}.month-start .day-number{font-size:13px;font-weight:900}.person-mark.work{color:#fff}.person-mark.off{background:color-mix(in srgb,var(--person) 18%,white)!important;color:color-mix(in srgb,var(--person) 78%,black);border:1px solid color-mix(in srgb,var(--person) 35%,white)}.person-mark.leave{background:transparent!important;color:var(--person);border:1px dashed var(--person)}.sticky-today{position:sticky;top:59px;z-index:18;display:none;background:rgba(247,247,245,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.sticky-today-inner{max-width:1180px;margin:auto;padding:7px 10px;display:flex;align-items:center;gap:6px}.sticky-label{font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--muted)}.sticky-spacer{flex:1}.mini-status{padding:4px 7px;border-radius:7px;color:#fff;font-size:10px;font-weight:900;white-space:nowrap}.mini-availability{font-size:10px;font-weight:900;white-space:nowrap}.palette{display:flex;gap:7px;flex-wrap:wrap}.swatch{width:28px;height:28px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px var(--line);cursor:pointer}.swatch.selected{box-shadow:0 0 0 2px var(--ink)}.person-colour-field{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.desktop-today{display:block}
@media(max-width:800px){body{background:#f7f7f5}.main{display:block;padding:10px 8px 74px}.sticky-today{display:block;top:57px}.today{display:none}.continuous-calendar{border-radius:14px;padding:8px}.continuous-title{font-size:16px}.continuous-calendar .weekdays{top:92px}.month-tag{font-size:7px}.month-start .day-number{font-size:12px}.side{display:none}.top-inner{padding:9px 10px}.brand{font-size:18px}.text-btn span{display:none}.today{border-radius:14px;padding:12px}.today-date{font-size:19px}.month{border-radius:14px;padding:8px;margin-bottom:10px}.month-title{font-size:16px}.day{min-height:61px;padding:4px 3px}.person-mark{height:13px;font-size:8px;padding:1px 3px}.person-mark b{display:none}.icons{font-size:8px;bottom:2px;right:2px}.bottom-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}.bottom-nav button{border:0;background:transparent;font-size:10px;font-weight:850;padding:7px}.bottom-nav b{display:block;font-size:18px}.seg{grid-template-columns:repeat(4,1fr)}.checks{grid-template-columns:1fr}.modal-wrap{align-items:flex-end}.person-colour-field{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="top-inner"><div class="brand">ROSTER</div><div class="spacer"></div><button class="text-btn" id="todayBtn">Today</button><button class="icon-btn" id="settingsBtn" aria-label="Settings">⋯</button></div></header><div class="sticky-today"><div class="sticky-today-inner"><span class="sticky-label">TODAY</span><span id="stickyMe" class="mini-status"></span><span id="stickyWife" class="mini-status"></span><span class="sticky-spacer"></span><span id="stickyAvailability" class="mini-availability"></span></div></div>
<main class="main"><section class="content"><div id="todayCard" class="today"></div><div id="months" class="continuous-calendar"><div class="continuous-head"><div class="continuous-title">Continuous Calendar</div><div id="calendarRange" class="continuous-range"></div></div><div class="weekdays" id="continuousWeekdays"></div><div class="grid" id="continuousGrid"></div></div></section><aside class="side"><div id="desktopToday" class="panel desktop-today"></div><div class="panel"><h2>UPCOMING BOTH OFF</h2><div class="upcoming" id="bothOff"></div></div><div class="panel"><h2>UPCOMING FAMILY</h2><div class="upcoming" id="familyUpcoming"></div></div><div class="panel"><h2>LEGEND</h2><div class="legend"><span><i class="dot" style="background:var(--work)"></i>Work</span><span><i class="dot" style="background:var(--off)"></i>Off</span><span><i class="dot" style="background:var(--leave)"></i>Leave</span><span><i class="dot" style="background:var(--school)"></i>School</span><span><i class="dot" style="background:var(--public)"></i>Holiday</span></div></div></aside></main>
<nav class="bottom-nav"><button id="navToday"><b>●</b>Today</button><button id="navAdd"><b>＋</b>Add</button><button id="navSettings"><b>⋯</b>More</button></nav>
</div>
<div class="modal-wrap" id="editor"><div class="sheet"><div class="sheet-head"><div><div class="eyebrow">EDIT DAY</div><div class="sheet-title" id="editorDate"></div></div><button class="icon-btn close" id="closeEditor">×</button></div><div class="field"><label id="meLabel">PRASHIL</label><div class="seg" id="meSeg"></div></div><div class="field"><label id="wifeLabel">WIFE</label><div class="seg" id="wifeSeg"></div></div><div class="field"><label>DAY FLAGS</label><div class="checks"><label class="check"><input type="checkbox" id="schoolHoliday"> School holiday</label><label class="check"><input type="checkbox" id="publicHoliday"> Holiday</label></div></div><div class="field"><label>FAMILY EVENT / HOLIDAY</label><input type="text" id="family" placeholder="e.g. Family trip"></div><div class="field"><label>NOTES</label><textarea id="notes" placeholder="Optional note"></textarea></div><div class="actions"><button class="danger" id="clearDay">Clear</button><button class="primary" id="saveDay">Save Day</button></div></div></div>
<div class="settings" id="settings"><div class="dialog"><div class="sheet-head"><div><div class="eyebrow">ROSTER</div><h2>Settings & Backup</h2></div><button class="icon-btn close" id="closeSettings">×</button></div><div class="settings-grid"><div class="person-colour-field"><div class="field"><label>YOUR NAME</label><input id="meName" type="text"></div><div class="field"><label>COLOUR</label><div class="palette" id="mePalette"></div></div></div><div class="person-colour-field"><div class="field"><label>PARTNER NAME</label><input id="wifeName" type="text"></div><div class="field"><label>COLOUR</label><div class="palette" id="wifePalette"></div></div></div><button class="text-btn" id="exportBtn">Export JSON Backup</button><button class="text-btn" id="importBtn">Import JSON Backup</button><input class="file-input" id="importFile" type="file" accept="application/json"><button class="danger" id="resetBtn">Reset All Data</button></div><div class="note">Data stays in this browser. Export a backup periodically and before clearing browser storage.</div></div></div>
<script>
(()=>{'use strict';
const KEY='roster.mvp.v1';
const STATUS=['NONE','WORK','OFF','LEAVE'];
const COLORS={WORK:'var(--work)',OFF:'var(--off)',LEAVE:'var(--leave)',NONE:'#c8cbc5'};
const PALETTE=['#5C7FA3','#6F8C74','#8A7698','#A38A70','#5F8D8A','#A07A84'];
const defaultState=()=>({version:1,settings:{meName:'Prashil',wifeName:'Wife',meColor:'#356fa8',wifeColor:'#a75f87'},days:{}});
let state=load(), editingKey='';
const $=s=>document.querySelector(s);
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.version===1?{...defaultState(),...x,settings:{...defaultState().settings,...x.settings},days:x.days||{}}:defaultState()}catch{return defaultState()}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function key(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function fromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function fmt(d,opt){return new Intl.DateTimeFormat('en-AU',opt).format(d)}
function record(k){return state.days[k]||{me:'NONE',wife:'NONE',family:'',notes:'',schoolHoliday:false,publicHoliday:false}}
function availability(r){const a=r.me!=='WORK'&&r.me!=='NONE',b=r.wife!=='WORK'&&r.wife!=='NONE';if(r.me==='WORK'&&r.wife==='WORK')return'BOTH WORKING';if(a&&b)return'BOTH OFF';if((a&&r.wife==='WORK')||(b&&r.me==='WORK'))return'ONE AVAILABLE';return'ROSTER NOT SET'}
function statusText(s){return s==='NONE'?'Not set':s[0]+s.slice(1).toLowerCase()}
function renderToday(){const d=new Date(),r=record(key(d)),meColor=state.settings.meColor,wifeColor=state.settings.wifeColor;$('#todayCard').innerHTML=`<div class="eyebrow">TODAY</div><div class="today-row"><div class="today-date">${fmt(d,{weekday:'long',day:'numeric',month:'long'})}</div><div class="availability">${availability(r)}</div></div><div class="people-now"><div class="person-card"><span class="person-name">${esc(state.settings.meName)}</span><span class="status-chip" style="background:${meColor}">${statusText(r.me)}</span></div><div class="person-card"><span class="person-name">${esc(state.settings.wifeName)}</span><span class="status-chip" style="background:${wifeColor}">${statusText(r.wife)}</span></div></div>`;$('#stickyMe').textContent=`${state.settings.meName}: ${statusText(r.me)}`;$('#stickyMe').style.background=meColor;$('#stickyWife').textContent=`${state.settings.wifeName}: ${statusText(r.wife)}`;$('#stickyWife').style.background=wifeColor;$('#stickyAvailability').textContent=availability(r);$('#desktopToday').innerHTML=$('#todayCard').innerHTML}
function renderMonths(){const now=new Date(),start=new Date(now.getFullYear(),now.getMonth()-1,1),end=new Date(now.getFullYear(),now.getMonth()+13,0);while(start.getDay()!==1)start.setDate(start.getDate()-1);while(end.getDay()!==0)end.setDate(end.getDate()+1);$('#calendarRange').textContent=`${fmt(start,{month:'short',year:'numeric'})} – ${fmt(end,{month:'short',year:'numeric'})}`;$('#continuousWeekdays').innerHTML=['M','T','W','T','F','S','S'].map(x=>`<div>${x}</div>`).join('');const grid=$('#continuousGrid');grid.innerHTML='';for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1))grid.appendChild(dayEl(new Date(d)))}
function monthEl(){return null}
function dayEl(d){const k=key(d),r=record(k),el=document.createElement('div'),isFirst=d.getDate()===1;el.id='day-'+k;el.className='day'+([0,6].includes(d.getDay())?' weekend':'')+(k===key(new Date())?' today-cell':'')+(isFirst?' month-start':'');let marks='';if(r.me!=='NONE')marks+=personMark(state.settings.meName,r.me,state.settings.meColor);if(r.wife!=='NONE')marks+=personMark(state.settings.wifeName,r.wife,state.settings.wifeColor);let icons='';if(r.family)icons+='<span title="Family event">●</span>';if(r.schoolHoliday)icons+='<span style="color:var(--school)" title="School holiday">●</span>';if(r.publicHoliday)icons+='<span style="color:var(--public)" title="Holiday">●</span>';el.innerHTML=`${isFirst?`<div class="month-tag">${fmt(d,{month:'short'}).toUpperCase()}${d.getMonth()===0?' '+d.getFullYear():''}</div>`:''}<div class="day-number">${d.getDate()}</div><div class="marks">${marks}</div><div class="icons" style="color:var(--family)">${icons}</div>`;el.onclick=()=>openEditor(k);return el}
function personMark(name,status,color){return`<div class="person-mark ${status.toLowerCase()}" style="--person:${color};background:${color}"><b>${esc(name.slice(0,1).toUpperCase())}</b>${statusText(status)}</div>`}
function renderSide(){const today=new Date();today.setHours(0,0,0,0);const pairs=Object.entries(state.days).filter(([k])=>fromKey(k)>=today).sort((a,b)=>a[0].localeCompare(b[0]));const both=pairs.filter(([,r])=>r.me!=='WORK'&&r.me!=='NONE'&&r.wife!=='WORK'&&r.wife!=='NONE').slice(0,6);$('#bothOff').innerHTML=both.length?both.map(([k])=>upRow(k,'Both off')).join(''):'<div class="empty">No shared days off entered.</div>';const fam=pairs.filter(([,r])=>r.family).slice(0,6);$('#familyUpcoming').innerHTML=fam.length?fam.map(([k,r])=>upRow(k,esc(r.family))).join(''):'<div class="empty">No family events entered.</div>'}
function upRow(k,text){const d=fromKey(k);return`<div class="up-row"><div class="up-date">${fmt(d,{day:'2-digit',month:'short'}).toUpperCase()}</div><div class="up-text">${text}</div></div>`}
function makeSeg(id,current){const box=$(id);box.innerHTML=STATUS.map(s=>`<button data-status="${s}" class="${s===current?'active':''}">${statusText(s)}</button>`).join('');box.onclick=e=>{const b=e.target.closest('button');if(!b)return;box.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}}
function segValue(id){return $(id).querySelector('.active').dataset.status}
function openEditor(k){editingKey=k;const d=fromKey(k),r=record(k);$('#editorDate').textContent=fmt(d,{weekday:'short',day:'numeric',month:'long',year:'numeric'});$('#meLabel').textContent=state.settings.meName.toUpperCase();$('#wifeLabel').textContent=state.settings.wifeName.toUpperCase();makeSeg('#meSeg',r.me);makeSeg('#wifeSeg',r.wife);$('#family').value=r.family||'';$('#notes').value=r.notes||'';$('#schoolHoliday').checked=!!r.schoolHoliday;$('#publicHoliday').checked=!!r.publicHoliday;$('#editor').classList.add('open')}
function closeEditor(){$('#editor').classList.remove('open')}
function saveDay(){const r={me:segValue('#meSeg'),wife:segValue('#wifeSeg'),family:$('#family').value.trim(),notes:$('#notes').value.trim(),schoolHoliday:$('#schoolHoliday').checked,publicHoliday:$('#publicHoliday').checked};if(Object.values(r).every(v=>v==='NONE'||v===''||v===false))delete state.days[editingKey];else state.days[editingKey]=r;persist();closeEditor();renderAll()}
function renderAll(){renderToday();renderMonths();renderSide()}
function scrollToday(){document.getElementById('day-'+key(new Date()))?.scrollIntoView({behavior:'smooth',block:'center'})}
function palette(id,current){$(id).innerHTML=PALETTE.map(c=>`<button type="button" class="swatch ${c===current?'selected':''}" data-color="${c}" style="background:${c}"></button>`).join('');$(id).onclick=e=>{const b=e.target.closest('.swatch');if(!b)return;$(id).querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}}
function openSettings(){$('#meName').value=state.settings.meName;$('#wifeName').value=state.settings.wifeName;palette('#mePalette',state.settings.meColor);palette('#wifePalette',state.settings.wifeColor);$('#settings').classList.add('open')}
function closeSettings(){state.settings.meName=$('#meName').value.trim()||'Me';state.settings.wifeName=$('#wifeName').value.trim()||'Partner';state.settings.meColor=$('#mePalette .selected')?.dataset.color||state.settings.meColor;state.settings.wifeColor=$('#wifePalette .selected')?.dataset.color||state.settings.wifeColor;persist();$('#settings').classList.remove('open');renderAll()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`roster-backup-${key(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(file){const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x||x.version!==1||typeof x.days!=='object')throw Error();state={...defaultState(),...x,settings:{...defaultState().settings,...x.settings},days:x.days};persist();closeSettings();renderAll();alert('Backup imported successfully.')}catch{alert('This is not a valid Roster v1 backup.')}};rd.readAsText(file)}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('#saveDay').onclick=saveDay;$('#clearDay').onclick=()=>{if(confirm('Clear all entries for this day?')){delete state.days[editingKey];persist();closeEditor();renderAll()}};$('#closeEditor').onclick=closeEditor;$('#editor').onclick=e=>{if(e.target===$('#editor'))closeEditor()};$('#settingsBtn').onclick=openSettings;$('#navSettings').onclick=openSettings;$('#closeSettings').onclick=closeSettings;$('#settings').onclick=e=>{if(e.target===$('#settings'))closeSettings()};$('#todayBtn').onclick=scrollToday;$('#navToday').onclick=scrollToday;$('#navAdd').onclick=()=>openEditor(key(new Date()));$('#exportBtn').onclick=exportData;$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>e.target.files[0]&&importData(e.target.files[0]);$('#resetBtn').onclick=()=>{if(confirm('Permanently delete all roster data from this browser?')){state=defaultState();persist();closeSettings();renderAll()}};
renderAll();setTimeout(scrollToday,50);
})();
</script>
</body></html>
